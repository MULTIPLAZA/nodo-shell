<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="55%" stop-color="#1e6bb0"/>
      <stop offset="100%" stop-color="#0a4c82"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo redondeado azul Office -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#g1)"/>

  <!-- Highlight superior tipo Aero -->
  <rect x="32" y="32" width="448" height="200" rx="80" ry="80" fill="url(#g2)"/>

  <!-- Letra N -->
  <g filter="url(#sh)" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-weight="700">
    <text x="256" y="358" text-anchor="middle" font-size="320" fill="#ffffff" letter-spacing="-12">N</text>
  </g>

  <!-- Marquito ribbon abajo (sutil, alude al ribbon UI) -->
  <rect x="80" y="404" width="352" height="8" rx="4" fill="#ffffff" fill-opacity="0.45"/>
  <rect x="80" y="420" width="220" height="6" rx="3" fill="#ffffff" fill-opacity="0.28"/>
</svg>
